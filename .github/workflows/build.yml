name: build geoip.dat

on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно; runetfreedom обновляет свои списки примерно раз в сутки
  workflow_dispatch:
  push:
    branches: [main]
    paths: [friend-source.txt, build_split.py, .github/workflows/build.yml]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 -I build_split.py friend-source.txt out

      - name: Sanity check
        run: |
          for f in geoip.dat geosite.dat; do
            size=$(stat -c %s out/$f); echo "$f: $size bytes"
            test "$size" -gt 500000
          done
          size=$(stat -c %s out/full/geoip.dat); echo "full/geoip.dat: $size bytes"
          test "$size" -gt 5000000
          grep -q "Итог geoip:friend" out/report.txt

      - name: Publish to release branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p publish/full && cp out/geoip.dat out/geosite.dat out/friend.txt out/report.txt publish/
          cp out/full/geoip.dat publish/full/
          cd publish
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build $(date -u +%F)"
          # одна запись в истории: ветка перезаписывается, репозиторий не разрастается
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" release
